<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PerfectSupreme | Digital Space</title>
  <meta name="description" content="PerfectSupreme's personal bio page" />
  <meta property="og:title" content="PerfectSupreme | Digital Space" />
  <meta property="og:description" content="Welcome to my digital space" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #d0e0f0;
      -webkit-font-smoothing: antialiased;
    }

    #matrix-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 0;
      background: #050a14;
    }

    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(5,8,12,0.4) 70%, rgba(3,5,8,0.8) 100%);
      transition: background 0.5s ease;
    }
    .vignette.video-active {
      background: rgba(0, 0, 0, 0.4);
    }

    #video-bg {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 0;
      object-fit: cover;
    }

    .center-wrapper {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; padding-bottom: 60px;
    }

    .bio-card-wrapper {
      opacity: 0; transform: translateY(20px) scale(0.95);
      animation: fadeIn 0.8s ease-out 0.3s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }

    .bio-card-outer {
      position: relative; width: 340px; max-width: 90vw;
      perspective: 1000px; transition: transform 0.15s ease-out;
    }

    .bio-card-glow {
      position: absolute; inset: -1px; border-radius: 6px;
      opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    }

    .bio-card {
      position: relative; border-radius: 6px;
      display: flex; flex-direction: column; align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bio-card-inner-glow {
      position: absolute; inset: 0; border-radius: 6px;
      opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    }

    .card-section-top {
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 32px 20px;
    }

    .card-divider {
      height: 1px; margin: 0 24px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    .card-divider-subtle {
      height: 1px; margin: 0 24px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    }

    .card-section-desc {
      padding: 20px 32px;
    }

    .card-section-links {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 20px 32px; flex-wrap: wrap;
    }

    .card-section-status {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 0 32px 20px;
    }

    .avatar-container {
      position: relative; width: 110px; height: 110px;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-decoration {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }
    .avatar-wrapper {
      border-radius: 50%; transition: box-shadow 0.5s ease; z-index: 1;
      box-shadow: 0 0 15px rgba(255,255,255,0.04);
    }
    .avatar-wrapper.hovered {
      box-shadow: 0 0 24px rgba(255,255,255,0.15), 0 0 48px rgba(200,200,200,0.05);
    }

    .avatar {
      width: 76px; height: 76px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      font-size: 22px; font-weight: 700; color: rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .info {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; position: relative; z-index: 10; width: 100%;
    }

    .name-row {
      display: flex; align-items: center; gap: 6px; justify-content: center;
      margin-top: 12px;
    }

    .name {
      font-size: 18px; font-weight: 600; letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.95);
      transition: text-shadow 0.4s ease;
      text-shadow: 0 0 10px rgba(255,255,255,0.08);
      position: relative;
      animation: glitch-skew 0.8s infinite linear alternate-reverse;
    }
    .name::before, .name::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; overflow: hidden;
    }
    .name::before {
      color: rgba(255, 255, 255, 0.7);
      animation: glitch-1 0.4s infinite linear alternate-reverse;
      clip-path: inset(10% 0 60% 0);
      text-shadow: 2px 0 rgba(255, 255, 255, 0.3);
    }
    .name::after {
      color: rgba(255, 255, 255, 0.7);
      animation: glitch-2 0.35s infinite linear alternate-reverse;
      clip-path: inset(55% 0 10% 0);
      text-shadow: -2px 0 rgba(255, 255, 255, 0.3);
    }
    .name.hovered {
      text-shadow: 0 0 16px rgba(255,255,255,0.25), 0 0 32px rgba(200,200,200,0.08);
    }
    @keyframes glitch-skew {
      0% { transform: translate(0, 0) skew(0deg); }
      10% { transform: translate(-1px, 1px) skew(0.5deg); }
      20% { transform: translate(1px, -1px) skew(-0.5deg); }
      30% { transform: translate(-1px, 0px) skew(0.3deg); }
      40% { transform: translate(1px, 1px) skew(-0.3deg); }
      50% { transform: translate(0px, -1px) skew(0.5deg); }
      60% { transform: translate(-1px, 1px) skew(-0.5deg); }
      70% { transform: translate(1px, 0px) skew(0.3deg); }
      80% { transform: translate(0px, 1px) skew(-0.3deg); }
      90% { transform: translate(-1px, -1px) skew(0.5deg); }
      100% { transform: translate(1px, 0px) skew(0deg); }
    }
    @keyframes glitch-1 {
      0% { transform: translate(0); clip-path: inset(10% 0 60% 0); }
      10% { transform: translate(3px, -1px); clip-path: inset(5% 0 65% 0); }
      20% { transform: translate(-2px, 1px); clip-path: inset(15% 0 55% 0); }
      30% { transform: translate(4px, 0px); clip-path: inset(8% 0 62% 0); }
      40% { transform: translate(-3px, -1px); clip-path: inset(12% 0 58% 0); }
      50% { transform: translate(2px, 1px); clip-path: inset(3% 0 67% 0); }
      60% { transform: translate(-4px, 0px); clip-path: inset(18% 0 52% 0); }
      70% { transform: translate(3px, -1px); clip-path: inset(7% 0 63% 0); }
      80% { transform: translate(-2px, 1px); clip-path: inset(14% 0 56% 0); }
      90% { transform: translate(4px, 0px); clip-path: inset(6% 0 64% 0); }
      100% { transform: translate(-3px, -1px); clip-path: inset(11% 0 59% 0); }
    }
    @keyframes glitch-2 {
      0% { transform: translate(0); clip-path: inset(55% 0 10% 0); }
      10% { transform: translate(-3px, 1px); clip-path: inset(60% 0 5% 0); }
      20% { transform: translate(2px, -1px); clip-path: inset(50% 0 15% 0); }
      30% { transform: translate(-4px, 0px); clip-path: inset(58% 0 7% 0); }
      40% { transform: translate(3px, 1px); clip-path: inset(53% 0 12% 0); }
      50% { transform: translate(-2px, -1px); clip-path: inset(62% 0 3% 0); }
      60% { transform: translate(4px, 0px); clip-path: inset(48% 0 17% 0); }
      70% { transform: translate(-3px, 1px); clip-path: inset(57% 0 8% 0); }
      80% { transform: translate(2px, -1px); clip-path: inset(52% 0 13% 0); }
      90% { transform: translate(-4px, 0px); clip-path: inset(61% 0 4% 0); }
      100% { transform: translate(3px, 1px); clip-path: inset(54% 0 11% 0); }
    }

    .tags {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
      margin-top: 8px;
    }
    .tag {
      font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 2px 10px; border-radius: 3px; font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.45);
    }

    .description {
      font-size: 13px; text-align: center; line-height: 1.6;
      color: rgba(255, 255, 255, 0.5); min-height: 2.6em;
    }
    .typing-cursor {
      color: rgba(255, 255, 255, 0.5);
      animation: blink 1.06s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .social-link {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none; transition: all 0.3s ease;
    }
    .social-link:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.9);
    }
    .social-link:active { transform: scale(0.97); }
    .social-link svg { width: 16px; height: 16px; fill: currentColor; }
    .name-badge {
      position: relative; display: flex; align-items: center; cursor: pointer;
      transition: all 0.2s ease;
    }
    .name-badge svg { width: 14px; height: 14px; transition: filter 0.2s ease; }
    .name-badge:hover svg { filter: drop-shadow(0 0 6px currentColor); }
    .badge-tooltip {
      position: absolute; left: 50%; top: -28px; transform: translateX(-50%) scale(0.9);
      padding: 2px 8px; border-radius: 3px; white-space: nowrap;
      font-size: 10px; letter-spacing: 0.08em;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
      z-index: 100;
    }
    .name-badge:hover .badge-tooltip {
      opacity: 1; visibility: visible; transform: translateX(-50%) scale(1);
    }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background-color: rgba(80, 220, 100, 0.8);
      box-shadow: 0 0 6px rgba(80, 220, 100, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text {
      font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: rgba(255, 255, 255, 0.35);
    }

    /* ===== VOLUME CONTROLS ===== */
    .volume-area {
      position: fixed; bottom: 24px; right: 24px; z-index: 50;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .volume-popup {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      margin-bottom: 4px; opacity: 0; visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
      transform: translateY(8px);
    }
    .volume-area:hover .volume-popup {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .vol-btn {
      width: 32px; height: 32px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; font-size: 14px;
    }
    .vol-btn:hover {
      border-color: rgba(255, 255, 255, 0.4); color: rgba(255, 255, 255, 1);
    }
    .vol-btn:active { transform: scale(0.95); }
    .vol-pct {
      font-size: 10px; letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums;
    }
    .music-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4); cursor: pointer; transition: all 0.3s ease;
      position: relative;
    }
    .music-btn:hover {
      transform: scale(1.05); border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
    }
    .music-btn:active { transform: scale(0.97); }
    .music-btn.playing { color: rgba(255, 255, 255, 0.9); }
    .music-btn svg { width: 16px; height: 16px; }
    .music-indicator {
      position: absolute; top: -4px; right: -4px;
      width: 8px; height: 8px; border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.8);
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* ===== MUSIC PLAYER BAR ===== */
    .player-bar {
      position: fixed; bottom: 24px; left: 24px;
      z-index: 40; display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; border-radius: 6px; min-width: 300px; max-width: 90vw;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0; animation: fadeIn 0.5s ease-out 1s forwards;
    }
    .player-icon {
      width: 28px; height: 28px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .player-icon svg { width: 14px; height: 14px; color: rgba(255, 255, 255, 0.6); stroke: currentColor; fill: none; }
    .player-info { flex: 1; min-width: 0; }
    .player-track-name {
      font-size: 11px; letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.8);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .player-progress-wrap {
      width: 100%; height: 4px; border-radius: 4px; margin-top: 4px;
      background: rgba(255,255,255,0.08); cursor: pointer; position: relative;
    }
    .player-progress {
      position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, rgba(255,255,255,0.5), rgba(200,200,200,0.5));
      transition: width 0.25s linear;
    }
    .player-times {
      display: flex; justify-content: space-between; margin-top: 2px;
      font-size: 9px; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums;
    }
    .player-controls { display: flex; align-items: center; gap: 4px; }
    .p-ctrl {
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: none; border: none;
      color: rgba(255, 255, 255, 0.5); transition: color 0.2s;
    }
    .p-ctrl:hover { color: rgba(255, 255, 255, 0.9); }
    .p-ctrl:active { transform: scale(0.95); }
    .p-ctrl svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .p-ctrl-play {
      width: 32px; height: 32px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.9); cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .p-ctrl-play:hover {
      background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.4);
    }
    .p-ctrl-play:active { transform: scale(0.95); }
    .p-ctrl-play svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== SPLASH ===== */
    .splash-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000000; cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .splash-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      opacity: 0; animation: fadeIn 1s ease-out 0.5s forwards;
    }
    .splash-title {
      font-size: 14px; font-weight: 300; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(255, 255, 255, 0.4);
    }
    .splash-enter {
      font-size: 18px; font-weight: 600; letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 40px rgba(200,200,200,0.1);
      animation: glowPulse 2s ease-in-out infinite;
      padding: 16px 40px; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px; background: rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }
    .splash-enter:hover {
      border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.08);
      text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 0 60px rgba(200,200,200,0.2);
    }
    .splash-hint { font-size: 11px; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.2); }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.2), 0 0 40px rgba(200,200,200,0.1); }
      50% { text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 0 60px rgba(200,200,200,0.2); }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash-screen">
    <canvas class="splash-canvas" id="splash-canvas"></canvas>
    <div class="splash-content">
      <div class="splash-title">welcome</div>
      <div class="splash-enter">CLICK TO ENTER</div>
      <div class="splash-hint">tap anywhere</div>
    </div>
  </div>

  <video id="video-bg" src="background.mp4" loop muted playsinline preload="auto" style="display:none"></video>
  <canvas id="matrix-canvas"></canvas>
  <div class="vignette" id="vignette"></div>

  <div class="center-wrapper">
    <div class="bio-card-wrapper">
      <div class="bio-card-outer" id="bio-card-outer">
        <div class="bio-card-glow" id="bio-card-glow"></div>
        <div class="bio-card">
          <div class="bio-card-inner-glow" id="bio-card-inner-glow"></div>

          <div class="card-section-top">
            <div class="avatar-container">
              <img class="avatar-decoration" src="https://cdn.discordapp.com/avatar-decoration-presets/a_26f13552ff23d9d5b3204d1934245764.png?size=160&passthrough=true" alt="" draggable="false" />
              <div class="avatar-wrapper" id="avatar-wrapper">
                <div class="avatar" id="avatar"><img src="avatar.png" alt="PerfectSupreme" /></div>
              </div>
            </div>

            <div class="name-row">
              <h1 class="name" id="bio-name" data-text="PerfectSupreme">PerfectSupreme - The Proken</h1>
              <div class="name-badge" style="color:rgba(0,200,255,0.7);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span class="badge-tooltip" style="background:rgba(0,200,255,0.15);border:1px solid rgba(0,200,255,0.3);color:rgba(0,200,255,0.95);">Verified</span>
              </div>
              <div class="name-badge" style="color:rgba(255,60,60,0.7);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span class="badge-tooltip" style="background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.3);color:rgba(255,60,60,0.95);">OG</span>
              </div>
              <div class="name-badge" style="color:rgba(255,60,60,0.7);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="badge-tooltip" style="background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.3);color:rgba(255,60,60,0.95);">Staff</span>
              </div>
            </div>

            <div class="tags">
              <span class="tag">Developer</span>
              <span class="tag">Creator</span>
            </div>
          </div>

          <div class="card-divider"></div>

          <div class="card-section-desc">
            <p class="description" id="bio-desc"></p>
          </div>

          <div class="card-divider-subtle"></div>

  <script>
    // ===== TRACK LIST =====
    // To add more music, put .mp3 files in the music/ folder and add entries here:
    var TRACKS = [
      { name: 'ᯓ', src: './music/track1.mp3' },
      { name: '★', src: './music/track2.mp3' }
    ];

    var currentTrack = 0;
    var volume = 0.3;

    // ===== TYPING EFFECT (LOOPING) =====
    var fullDesc = "Developer / Creator. Building cool things on the internet. Welcome to my digital space.";
    var descEl = document.getElementById('bio-desc');
    var charIdx = 0;
    var typeDeleting = false;
    function typeTick() {
      if (!typeDeleting) {
        charIdx++;
        descEl.innerHTML = fullDesc.slice(0, charIdx) + '<span class="typing-cursor">|</span>';
        if (charIdx >= fullDesc.length) {
          setTimeout(function() { typeDeleting = true; typeTick(); }, 2000);
        } else {
          setTimeout(typeTick, 35);
        }
      } else {
        charIdx--;
        descEl.innerHTML = fullDesc.slice(0, charIdx) + '<span class="typing-cursor">|</span>';
        if (charIdx <= 0) {
          setTimeout(function() { typeDeleting = false; typeTick(); }, 500);
        } else {
          setTimeout(typeTick, 20);
        }
      }
    }
    setTimeout(typeTick, 300);

    // ===== SPLASH SCREEN =====
    var splashScreen = document.getElementById('splash-screen');
    var splashCanvas = document.getElementById('splash-canvas');
    var splashCtx = splashCanvas.getContext('2d');
    var splashNodes = [];
    var splashActive = true;
    var NODE_COLORS = [[255,255,255],[200,200,200],[160,160,160],[220,220,220],[180,180,180]];

    function initSplash() {
      splashCanvas.width = window.innerWidth;
      splashCanvas.height = window.innerHeight;
      splashNodes = [];
      var count = Math.floor((splashCanvas.width * splashCanvas.height) / 18000);
      for (var i = 0; i < count; i++) {
        splashNodes.push({
          x: Math.random() * splashCanvas.width,
          y: Math.random() * splashCanvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: Math.random() * 1.5 + 0.5,
          ci: Math.floor(Math.random() * NODE_COLORS.length)
        });
      }
    }

    function drawSplash() {
      if (!splashActive) return;
      splashCtx.clearRect(0, 0, splashCanvas.width, splashCanvas.height);
      splashCtx.fillStyle = '#000000';
      splashCtx.fillRect(0, 0, splashCanvas.width, splashCanvas.height);
      for (var i = 0; i < splashNodes.length; i++) {
        var n = splashNodes[i];
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > splashCanvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > splashCanvas.height) n.vy *= -1;
        for (var j = i + 1; j < splashNodes.length; j++) {
          var dx = splashNodes[j].x - n.x, dy = splashNodes[j].y - n.y;
          var d = Math.sqrt(dx*dx+dy*dy);
          if (d < 120) {
            splashCtx.beginPath();
            splashCtx.moveTo(n.x, n.y);
            splashCtx.lineTo(splashNodes[j].x, splashNodes[j].y);
            splashCtx.strokeStyle = 'rgba(255,255,255,' + (0.06 * (1 - d/120)) + ')';
            splashCtx.lineWidth = 0.5;
            splashCtx.stroke();
          }
        }
        var c = NODE_COLORS[n.ci];
        splashCtx.beginPath();
        splashCtx.arc(n.x, n.y, n.size, 0, Math.PI*2);
        splashCtx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.15)';
        splashCtx.fill();
      }
      requestAnimationFrame(drawSplash);
    }

    initSplash();
    drawSplash();
    window.addEventListener('resize', initSplash);

    splashScreen.addEventListener('click', function() {
      splashActive = false;
      splashScreen.classList.add('hidden');
      var vb = document.getElementById('video-bg');
      if (vb) { vb.currentTime = 0; vb.play(); }
      startAudio();
    });

    function startAudio() {
      var audio = new Audio(TRACKS[currentTrack].src);
      audio.loop = (TRACKS.length === 1);
      audio.volume = volume;
      audio.preload = 'auto';
      window._bioAudio = audio;

      audio.addEventListener('ended', function() {
        if (TRACKS.length > 1) { playNext(); }
      });

      audio.play().then(function() {
        setPlayingUI(true);
      }).catch(function() {});
    }

    // ===== COBWEB NETWORK BACKGROUND =====
    var canvas = document.getElementById('matrix-canvas');
    var ctx = canvas.getContext('2d');
    var mouse = {x:-1000,y:-1000};
    var nodes = [];
    var CDIST=200, MRAD=300, MATT=0.015, NCF=8000;

    function createNodes() {
      var count=Math.max(60,Math.min(Math.floor((canvas.width*canvas.height)/NCF),250));
      nodes=[];
      for (var i=0;i<count;i++) {
        nodes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,
          vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,
          sz:Math.random()*2+0.8,pulse:Math.random()*Math.PI*2,
          bop:Math.random()*0.4+0.15,ci:Math.floor(Math.random()*5)});
      }
    }

    function resizeCanvas() {
      canvas.width=window.innerWidth;canvas.height=window.innerHeight;
      createNodes();
    }
    resizeCanvas();
    window.addEventListener('resize',resizeCanvas);
    window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
    window.addEventListener('mouseleave',function(){mouse.x=-1000;mouse.y=-1000;});

    var NCOL=[[255,255,255],[200,200,200],[160,160,160],[220,220,220],[180,180,180]];

    function drawNet() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#000000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      var mx=mouse.x,my=mouse.y;

      for (var i=0;i<nodes.length;i++) {
        var n=nodes[i];
        var dx=n.x-mx,dy=n.y-my;
        var dist=Math.sqrt(dx*dx+dy*dy);
        var mI=Math.max(0,1-dist/MRAD);
        if (dist<MRAD&&dist>0){n.vx+=(dx/dist)*-MATT*mI;n.vy+=(dy/dist)*-MATT*mI;}
        n.vx*=0.96;n.vy*=0.96;
        var ms=0.5+mI*1,sp=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
        if (sp>ms){n.vx=(n.vx/sp)*ms;n.vy=(n.vy/sp)*ms;}
        n.x+=n.vx;n.y+=n.vy;
        if (n.x<-50) n.x=canvas.width+50;
        if (n.x>canvas.width+50) n.x=-50;
        if (n.y<-50) n.y=canvas.height+50;
        if (n.y>canvas.height+50) n.y=-50;
      }

      if (mx>0&&my>0) {
        for (var i=0;i<nodes.length;i++) {
          var n=nodes[i];
          var dx=n.x-mx,dy=n.y-my,dist=Math.sqrt(dx*dx+dy*dy);
          if (dist<MRAD) {
            var al=0.2*(1-dist/MRAD);
            ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(n.x,n.y);
            ctx.strokeStyle='rgba(200,200,200,'+al+')';ctx.lineWidth=1;ctx.stroke();
          }
        }
      }

      for (var i=0;i<nodes.length;i++) {
        var a=nodes[i];
        for (var j=i+1;j<nodes.length;j++) {
          var b=nodes[j];
          var dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
          if (dist<CDIST) {
            var alpha=1-dist/CDIST;
            var midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
            var mdx=midX-mx,mdy=midY-my;
            var mD=Math.sqrt(mdx*mdx+mdy*mdy);
            var mI=Math.max(0,1-mD/MRAD);
            var fA=alpha*(0.08+mI*0.3);
            var cA=NCOL[a.ci],cB=NCOL[b.ci];
            var r=(cA[0]+cB[0])/2,g=(cA[1]+cB[1])/2,bl=(cA[2]+cB[2])/2;
            ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
            ctx.strokeStyle='rgba('+r+','+g+','+bl+','+fA+')';ctx.lineWidth=0.6+mI*1.4;ctx.stroke();
          }
        }
      }

      for (var i=0;i<nodes.length;i++) {
        var n=nodes[i];n.pulse+=0.02;
        var dx=n.x-mx,dy=n.y-my,dist=Math.sqrt(dx*dx+dy*dy);
        var mI=Math.max(0,1-dist/MRAD);
        var pv=Math.sin(n.pulse)*0.3+0.7;
        var nA=(n.bop+mI*0.5)*pv;
        var nS=n.sz+mI*2;
        var c=NCOL[n.ci];
        ctx.beginPath();ctx.arc(n.x,n.y,nS,0,Math.PI*2);
        ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+nA+')';
        if (mI>0.3){ctx.shadowColor='rgba('+c[0]+','+c[1]+','+c[2]+','+(mI*0.6)+')';ctx.shadowBlur=8+mI*12;}
        ctx.fill();ctx.shadowBlur=0;
        if (mI>0.5) {
          ctx.beginPath();ctx.arc(n.x,n.y,nS+4,0,Math.PI*2);
          ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(mI*0.15)+')';ctx.lineWidth=0.5;ctx.stroke();
        }
      }

      if (mx>0&&my>0) {
        var gr=ctx.createRadialGradient(mx,my,0,mx,my,MRAD);
        gr.addColorStop(0,'rgba(80,140,255,0.04)');gr.addColorStop(0.5,'rgba(60,100,220,0.015)');gr.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=gr;ctx.fillRect(0,0,canvas.width,canvas.height);
      }

      requestAnimationFrame(drawNet);
    }
    drawNet();

    // ===== BIO CARD HOVER =====
    var cardOuter = document.getElementById('bio-card-outer');
    var cardGlow = document.getElementById('bio-card-glow');
    var cardInnerGlow = document.getElementById('bio-card-inner-glow');
    var avatarWrapper = document.getElementById('avatar-wrapper');
    var bioName = document.getElementById('bio-name');
    var cardX=0,cardY=0,cardRX=0,cardRY=0;
    var targetX=0,targetY=0,targetRX=0,targetRY=0;

    window.addEventListener('mousemove', function(e) {
      var rect = cardOuter.getBoundingClientRect();
      var cX=rect.left+rect.width/2, cY=rect.top+rect.height/2;
      var dx=e.clientX-cX, dy=e.clientY-cY, dist=Math.sqrt(dx*dx+dy*dy);
      var inf = Math.max(0, 1-dist/400);
      targetX=(dx/400)*12*inf; targetY=(dy/400)*12*inf;
      targetRY=(dx/rect.width)*8*inf; targetRX=(-dy/rect.height)*8*inf;
      var gX=((e.clientX-rect.left)/rect.width)*100, gY=((e.clientY-rect.top)/rect.height)*100;
      if (dist < 400) {
        cardGlow.style.opacity='0.5';
        cardGlow.style.background='conic-gradient(from 180deg at '+gX+'% '+gY+'%, rgba(255,255,255,0.25) 0deg, rgba(180,180,180,0.1) 90deg, rgba(255,255,255,0.25) 180deg, rgba(180,180,180,0.1) 270deg, rgba(255,255,255,0.25) 360deg)';
        cardInnerGlow.style.opacity='1';
        cardInnerGlow.style.background='radial-gradient(circle at '+gX+'% '+gY+'%, rgba(255,255,255,0.03) 0%, transparent 60%)';
        avatarWrapper.classList.add('hovered');
        bioName.classList.add('hovered');
      } else {
        cardGlow.style.opacity='0'; cardInnerGlow.style.opacity='0';
        avatarWrapper.classList.remove('hovered'); bioName.classList.remove('hovered');
      }
    });

    function animateCard() {
      var e=0.08;
      cardX+=(targetX-cardX)*e; cardY+=(targetY-cardY)*e;
      cardRX+=(targetRX-cardRX)*e; cardRY+=(targetRY-cardRY)*e;
      cardOuter.style.transform='translate('+cardX+'px,'+cardY+'px) rotateX('+cardRX+'deg) rotateY('+cardRY+'deg)';
      requestAnimationFrame(animateCard);
    }
    animateCard();

    // ===== MUSIC PLAYER =====
    var musicBtn = document.getElementById('music-btn');
    var iconMuted = document.getElementById('icon-muted');
    var iconPlaying = document.getElementById('icon-playing');
    var musicIndicator = document.getElementById('music-indicator');
    var volPct = document.getElementById('vol-pct');
    var ppPlay = document.getElementById('pp-play');
    var ppPause = document.getElementById('pp-pause');
    var trackNameEl = document.getElementById('track-name');
    var progressFill = document.getElementById('progress-fill');
    var timeCurrent = document.getElementById('time-current');
    var timeTotal = document.getElementById('time-total');
    var progressWrap = document.getElementById('progress-wrap');

    function setPlayingUI(playing) {
      window._bioIsPlaying = playing;
      if (playing) {
        iconMuted.style.display='none'; iconPlaying.style.display='block';
        musicBtn.classList.add('playing'); musicIndicator.style.display='none';
        ppPlay.style.display='none'; ppPause.style.display='block';
      } else {
        iconMuted.style.display='block'; iconPlaying.style.display='none';
        musicBtn.classList.remove('playing');
        ppPlay.style.display='block'; ppPause.style.display='none';
      }
    }

    function formatTime(s) {
      if (!s||isNaN(s)) return '0:00';
      var m=Math.floor(s/60), sec=Math.floor(s%60);
      return m+':'+(sec<10?'0':'')+sec;
    }

    function updateProgress() {
      var a = window._bioAudio;
      if (a && a.duration) {
        progressFill.style.width=(a.currentTime/a.duration*100)+'%';
        timeCurrent.textContent=formatTime(a.currentTime);
        timeTotal.textContent=formatTime(a.duration);
      }
    }
    setInterval(updateProgress, 250);

    function loadTrack(idx) {
      var a = window._bioAudio;
      var wasPlaying = window._bioIsPlaying;
      if (a) { a.pause(); }
      currentTrack = idx;
      trackNameEl.textContent = TRACKS[idx].name;
      a = new Audio(TRACKS[idx].src);
      a.loop = (TRACKS.length === 1);
      a.volume = volume;
      window._bioAudio = a;
      a.addEventListener('ended', function() { if (TRACKS.length > 1) playNext(); });
      progressFill.style.width = '0%';
      if (wasPlaying) { a.play().then(function(){ setPlayingUI(true); }).catch(function(){}); }
    }

    function playNext() { loadTrack((currentTrack+1)%TRACKS.length); }
    function playPrev() { loadTrack((currentTrack-1+TRACKS.length)%TRACKS.length); }

    musicBtn.addEventListener('click', function() {
      var a = window._bioAudio;
      if (!a) { startAudio(); return; }
      musicIndicator.style.display='none';
      if (window._bioIsPlaying) { a.pause(); setPlayingUI(false); }
      else { a.play().catch(function(){}); setPlayingUI(true); }
    });

    document.getElementById('btn-play').addEventListener('click', function() {
      var a = window._bioAudio;
      if (!a) { startAudio(); return; }
      if (window._bioIsPlaying) { a.pause(); setPlayingUI(false); }
      else { a.play().catch(function(){}); setPlayingUI(true); }
    });

    document.getElementById('btn-next').addEventListener('click', function() { playNext(); });
    document.getElementById('btn-prev').addEventListener('click', function() { playPrev(); });

    document.getElementById('vol-up').addEventListener('click', function() {
      volume = Math.min(1, volume + 0.1);
      if (window._bioAudio) window._bioAudio.volume = volume;
      volPct.textContent = Math.round(volume*100) + '%';
    });

    document.getElementById('vol-down').addEventListener('click', function() {
      volume = Math.max(0, volume - 0.1);
      if (window._bioAudio) window._bioAudio.volume = volume;
      volPct.textContent = Math.round(volume*100) + '%';
    });

    progressWrap.addEventListener('click', function(e) {
      var a = window._bioAudio;
      if (!a || !a.duration) return;
      var rect = progressWrap.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      a.currentTime = pct * a.duration;
    });

    // ===== VIDEO BACKGROUND AUTO-DETECT =====
    var videoBg = document.getElementById('video-bg');
    var matrixCanvas = document.getElementById('matrix-canvas');
    var vignetteEl = document.getElementById('vignette');

    videoBg.addEventListener('canplay', function() {
      videoBg.style.display = 'block';
      matrixCanvas.style.display = 'none';
      vignetteEl.classList.add('video-active');
    });

    videoBg.addEventListener('error', function() {
      videoBg.style.display = 'none';
      matrixCanvas.style.display = 'block';
      vignetteEl.classList.remove('video-active');
    });
  </script>
</body>
</html>
