<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio | Digital Space</title>
  <meta name="description" content="A personal bio page with a hacker aesthetic" />
  <meta property="og:title" content="Bio | Digital Space" />
  <meta property="og:description" content="Welcome to my digital space" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: #020a05;
      color: #d0e8da;
      -webkit-font-smoothing: antialiased;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: linear-gradient(180deg, #020a05 0%, #050f08 50%, #020a05 100%);
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(2,10,5,0.4) 70%, rgba(2,10,5,0.8) 100%);
    }

    .center-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .bio-card-wrapper {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      animation: fadeIn 0.8s ease-out 0.3s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bio-card-outer {
      position: relative;
      width: 340px;
      max-width: 90vw;
      perspective: 1000px;
      transition: transform 0.15s ease-out;
    }

    .bio-card-glow {
      position: absolute;
      inset: -1px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .bio-card {
      position: relative;
      border-radius: 6px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(5, 20, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 100, 0.08);
    }

    .bio-card-inner-glow {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .avatar-wrapper {
      border-radius: 50%;
      transition: box-shadow 0.5s ease;
      box-shadow: 0 0 15px rgba(0,255,100,0.1), 0 0 30px rgba(0,255,100,0.05);
    }

    .avatar-wrapper.hovered {
      box-shadow: 0 0 30px rgba(0,255,100,0.3), 0 0 60px rgba(0,255,100,0.1);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 100, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 255, 100, 0.1);
      font-size: 22px;
      font-weight: 700;
      color: rgba(0, 255, 100, 0.9);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 10;
    }

    .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(0, 255, 100, 0.9);
      transition: text-shadow 0.4s ease;
      text-shadow: 0 0 10px rgba(0,255,100,0.2);
    }

    .name.hovered {
      text-shadow: 0 0 20px rgba(0,255,100,0.5), 0 0 40px rgba(0,255,100,0.2);
    }

    .divider {
      width: 64px;
      height: 1px;
      margin: 4px 0;
      background: linear-gradient(90deg, transparent, rgba(0,255,100,0.4), transparent);
    }

    .description {
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
      padding: 0 8px;
      color: rgba(180, 220, 195, 0.7);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      position: relative;
      z-index: 10;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: rgba(0, 255, 100, 0.05);
      border: 1px solid rgba(0, 255, 100, 0.1);
      color: rgba(0, 255, 100, 0.6);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-link:hover {
      transform: scale(1.05);
      background: rgba(0, 255, 100, 0.1);
      border-color: rgba(0, 255, 100, 0.3);
      color: rgba(0, 255, 100, 0.9);
    }

    .social-link:active {
      transform: scale(0.97);
    }

    .social-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      position: relative;
      z-index: 10;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(0, 255, 100, 0.8);
      box-shadow: 0 0 8px rgba(0, 255, 100, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(0, 255, 100, 0.5);
    }

    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: rgba(5, 20, 10, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 100, 0.15);
      color: rgba(0, 255, 100, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.05);
      border-color: rgba(0, 255, 100, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 100, 0.15);
    }

    .music-btn:active {
      transform: scale(0.97);
    }

    .music-btn.playing {
      color: rgba(0, 255, 100, 0.9);
    }

    .music-btn svg {
      width: 16px;
      height: 16px;
    }

    .music-indicator {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(0, 255, 100, 0.8);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .bottom-fade {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(to top, rgba(2,10,5,0.6), transparent);
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020a05;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.5s forwards;
    }

    .splash-title {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(0, 255, 100, 0.4);
    }

    .splash-enter {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(0, 255, 100, 0.85);
      text-shadow: 0 0 20px rgba(0,255,100,0.3), 0 0 40px rgba(0,255,100,0.1);
      animation: glowPulse 2s ease-in-out infinite;
      padding: 16px 40px;
      border: 1px solid rgba(0, 255, 100, 0.15);
      border-radius: 6px;
      background: rgba(0, 255, 100, 0.03);
      transition: all 0.3s ease;
    }

    .splash-enter:hover {
      border-color: rgba(0, 255, 100, 0.4);
      background: rgba(0, 255, 100, 0.08);
      text-shadow: 0 0 30px rgba(0,255,100,0.5), 0 0 60px rgba(0,255,100,0.2);
    }

    .splash-hint {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(0, 255, 100, 0.2);
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(0,255,100,0.3), 0 0 40px rgba(0,255,100,0.1); }
      50% { text-shadow: 0 0 30px rgba(0,255,100,0.5), 0 0 60px rgba(0,255,100,0.2); }
    }
  </style>
</head>
<body>

  <div class="bottom-fade"></div>

  <script>
    // ========== SPLASH SCREEN ==========
    const splashScreen = document.getElementById('splash-screen');
    const splashCanvas = document.getElementById('splash-canvas');
    const splashCtx = splashCanvas.getContext('2d');
    let splashNodes = [];
    let splashActive = true;

    function initSplash() {
      splashCanvas.width = window.innerWidth;
      splashCanvas.height = window.innerHeight;
      splashNodes = [];
      var count = Math.floor((splashCanvas.width * splashCanvas.height) / 18000);
      for (var i = 0; i < count; i++) {
        splashNodes.push({
          x: Math.random() * splashCanvas.width,
          y: Math.random() * splashCanvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: Math.random() * 1.5 + 0.5
        });
      }
    }

    function drawSplash() {
      if (!splashActive) return;
      splashCtx.clearRect(0, 0, splashCanvas.width, splashCanvas.height);
      splashCtx.fillStyle = '#020a05';
      splashCtx.fillRect(0, 0, splashCanvas.width, splashCanvas.height);
      for (var i = 0; i < splashNodes.length; i++) {
        var n = splashNodes[i];
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > splashCanvas.width) n.vx *= -1;
        if (n.y < 0 || n.y > splashCanvas.height) n.vy *= -1;
        for (var j = i + 1; j < splashNodes.length; j++) {
          var dx = splashNodes[j].x - n.x, dy = splashNodes[j].y - n.y;
          var d = Math.sqrt(dx*dx+dy*dy);
          if (d < 120) {
            splashCtx.beginPath();
            splashCtx.moveTo(n.x, n.y);
            splashCtx.lineTo(splashNodes[j].x, splashNodes[j].y);
            splashCtx.strokeStyle = 'rgba(0,255,100,' + (0.08 * (1 - d/120)) + ')';
            splashCtx.lineWidth = 0.5;
            splashCtx.stroke();
          }
        }
        splashCtx.beginPath();
        splashCtx.arc(n.x, n.y, n.size, 0, Math.PI*2);
        splashCtx.fillStyle = 'rgba(0,255,100,0.15)';
        splashCtx.fill();
      }
      requestAnimationFrame(drawSplash);
    }

    initSplash();
    drawSplash();
    window.addEventListener('resize', initSplash);

    splashScreen.addEventListener('click', function() {
      splashActive = false;
      splashScreen.classList.add('hidden');

      var audio = new Audio('./music/background.mp3');
      audio.loop = true;
      audio.volume = 0.3;
      audio.preload = 'auto';
      window._bioAudio = audio;

      var iconMuted = document.getElementById('icon-muted');
      var iconPlaying = document.getElementById('icon-playing');
      var musicBtn = document.getElementById('music-btn');
      var musicIndicator = document.getElementById('music-indicator');

      audio.addEventListener('canplaythrough', function() {
        audio.play().then(function() {
          iconMuted.style.display = 'none';
          iconPlaying.style.display = 'block';
          musicBtn.classList.add('playing');
          musicIndicator.style.display = 'none';
          window._bioIsPlaying = true;
        }).catch(function() {});
      }, { once: true });

      audio.addEventListener('error', function() {
        iconMuted.style.display = 'block';
        iconPlaying.style.display = 'none';
        musicBtn.classList.remove('playing');
        musicIndicator.style.display = 'none';
        window._bioIsPlaying = false;
      });

      audio.play().then(function() {
        iconMuted.style.display = 'none';
        iconPlaying.style.display = 'block';
        musicBtn.classList.add('playing');
        musicIndicator.style.display = 'none';
        window._bioIsPlaying = true;
      }).catch(function() {});
    });

    // ========== NETWORK / COBWEB BACKGROUND ==========
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    let mouse = { x: -1000, y: -1000 };
    let nodes = [];
    const CONNECT_DIST = 160;
    const MOUSE_RADIUS = 280;
    const MOUSE_ATTRACT = 0.045;
    const NODE_COUNT_FACTOR = 6000;

    function createNodes() {
      var count = Math.floor((canvas.width * canvas.height) / NODE_COUNT_FACTOR);
      count = Math.max(100, Math.min(count, 400));
      nodes = [];
      for (var i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: Math.random() * 1.8 + 0.6,
          pulse: Math.random() * Math.PI * 2,
          baseOpacity: Math.random() * 0.3 + 0.1
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createNodes();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', function(e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', function() {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    function drawNetwork() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#060d08';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var dx = n.x - mouse.x;
        var dy = n.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var mouseInf = Math.max(0, 1 - dist / MOUSE_RADIUS);

        if (dist < MOUSE_RADIUS && dist > 0) {
          n.vx += (dx / dist) * -MOUSE_ATTRACT * mouseInf;
          n.vy += (dy / dist) * -MOUSE_ATTRACT * mouseInf;
        }

        n.vx *= 0.98;
        n.vy *= 0.98;

        var maxSpeed = 1 + mouseInf * 2;
        var speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
        if (speed > maxSpeed) {
          n.vx = (n.vx / speed) * maxSpeed;
          n.vy = (n.vy / speed) * maxSpeed;
        }

        n.x += n.vx;
        n.y += n.vy;

        if (n.x < -50) n.x = canvas.width + 50;
        if (n.x > canvas.width + 50) n.x = -50;
        if (n.y < -50) n.y = canvas.height + 50;
        if (n.y > canvas.height + 50) n.y = -50;
      }

      if (mouse.x > 0 && mouse.y > 0) {
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          var dx = n.x - mouse.x;
          var dy = n.y - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MOUSE_RADIUS) {
            var alpha = 0.2 * (1 - dist / MOUSE_RADIUS);
            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(n.x, n.y);
            ctx.strokeStyle = 'rgba(0, 255, 100, ' + alpha + ')';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      for (var i = 0; i < nodes.length; i++) {
        var a = nodes[i];
        for (var j = i + 1; j < nodes.length; j++) {
          var b = nodes[j];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < CONNECT_DIST) {
            var alpha = (1 - dist / CONNECT_DIST);

            var midX = (a.x + b.x) / 2;
            var midY = (a.y + b.y) / 2;
            var mDx = midX - mouse.x;
            var mDy = midY - mouse.y;
            var mDist = Math.sqrt(mDx * mDx + mDy * mDy);
            var mInf = Math.max(0, 1 - mDist / MOUSE_RADIUS);

            var lineAlpha = alpha * (0.12 + mInf * 0.3);
            var lineWidth = 0.5 + mInf * 1.5;

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + lineAlpha + ')';
            ctx.lineWidth = lineWidth;
            ctx.stroke();

            if (mInf > 0.3) {
              ctx.shadowColor = 'rgba(255, 255, 255, ' + (mInf * 0.2) + ')';
              ctx.shadowBlur = mInf * 6;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = 'rgba(255, 255, 255, ' + (lineAlpha * 0.4) + ')';
              ctx.lineWidth = lineWidth + 0.5;
              ctx.stroke();
              ctx.shadowBlur = 0;
            }
          }
        }
      }

      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        n.pulse += 0.015;
        var dx = n.x - mouse.x;
        var dy = n.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var mouseInf = Math.max(0, 1 - dist / MOUSE_RADIUS);

        var pulseGlow = Math.sin(n.pulse) * 0.15 + 0.85;
        var nodeAlpha = (n.baseOpacity + mouseInf * 0.6) * pulseGlow;
        var nodeSize = n.size + mouseInf * 2.5;

        if (mouseInf > 0.1) {
          ctx.shadowColor = 'rgba(0, 255, 100, ' + (mouseInf * 0.6) + ')';
          ctx.shadowBlur = 8 + mouseInf * 12;
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, nodeSize, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 255, 100, ' + nodeAlpha + ')';
        ctx.fill();
        ctx.shadowBlur = 0;

        if (mouseInf > 0.5) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, nodeSize + 3, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 255, 100, ' + (mouseInf * 0.12) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      if (mouse.x > 0 && mouse.y > 0) {
        var grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, MOUSE_RADIUS);
        grad.addColorStop(0, 'rgba(0, 255, 100, 0.02)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(drawNetwork);
    }

    drawNetwork();

    // ========== BIO CARD HOVER ==========
    const cardOuter = document.getElementById('bio-card-outer');
    const cardGlow = document.getElementById('bio-card-glow');
    const cardInnerGlow = document.getElementById('bio-card-inner-glow');
    const avatarWrapper = document.getElementById('avatar-wrapper');
    const bioName = document.getElementById('bio-name');

    let cardX = 0, cardY = 0, cardRX = 0, cardRY = 0;
    let targetX = 0, targetY = 0, targetRX = 0, targetRY = 0;
    let isCardHovered = false;

    window.addEventListener('mousemove', function(e) {
      const rect = cardOuter.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = e.clientX - centerX;
      const dy = e.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 400;
      const influence = Math.max(0, 1 - dist / maxDist);

      targetX = (dx / maxDist) * 12 * influence;
      targetY = (dy / maxDist) * 12 * influence;
      targetRY = (dx / rect.width) * 8 * influence;
      targetRX = (-dy / rect.height) * 8 * influence;

      const glowX = ((e.clientX - rect.left) / rect.width) * 100;
      const glowY = ((e.clientY - rect.top) / rect.height) * 100;

      isCardHovered = dist < maxDist;

      if (isCardHovered) {
        cardGlow.style.opacity = '0.7';
        cardGlow.style.background = 'conic-gradient(from 180deg at ' + glowX + '% ' + glowY + '%, rgba(0,255,100,0.4) 0deg, rgba(0,200,80,0.1) 90deg, rgba(0,255,100,0.4) 180deg, rgba(0,200,80,0.1) 270deg, rgba(0,255,100,0.4) 360deg)';
        cardInnerGlow.style.opacity = '1';
        cardInnerGlow.style.background = 'radial-gradient(circle at ' + glowX + '% ' + glowY + '%, rgba(0,255,100,0.06) 0%, transparent 60%)';
        avatarWrapper.classList.add('hovered');
        bioName.classList.add('hovered');
      } else {
        cardGlow.style.opacity = '0';
        cardInnerGlow.style.opacity = '0';
        avatarWrapper.classList.remove('hovered');
        bioName.classList.remove('hovered');
      }
    });

    function animateCard() {
      const ease = 0.08;
      cardX += (targetX - cardX) * ease;
      cardY += (targetY - cardY) * ease;
      cardRX += (targetRX - cardRX) * ease;
      cardRY += (targetRY - cardRY) * ease;

      cardOuter.style.transform = 'translate(' + cardX + 'px, ' + cardY + 'px) rotateX(' + cardRX + 'deg) rotateY(' + cardRY + 'deg)';
      requestAnimationFrame(animateCard);
    }

    animateCard();

    // ========== MUSIC PLAYER ==========
    const musicBtn = document.getElementById('music-btn');
    const iconMuted = document.getElementById('icon-muted');
    const iconPlaying = document.getElementById('icon-playing');
    const musicIndicator = document.getElementById('music-indicator');

    musicBtn.addEventListener('click', function() {
      var audio = window._bioAudio;
      if (!audio) {
        audio = new Audio('./music/background.mp3');
        audio.loop = true;
        audio.volume = 0.3;
        window._bioAudio = audio;
      }

      musicIndicator.style.display = 'none';

      if (window._bioIsPlaying) {
        audio.pause();
        window._bioIsPlaying = false;
        iconMuted.style.display = 'block';
        iconPlaying.style.display = 'none';
        musicBtn.classList.remove('playing');
      } else {
        audio.play().catch(function() {});
        window._bioIsPlaying = true;
        iconMuted.style.display = 'none';
        iconPlaying.style.display = 'block';
        musicBtn.classList.add('playing');
      }
    });
  </script>
</body>
</html>
